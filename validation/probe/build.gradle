plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.egguncle.rpduo.imeprobe'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.egguncle.rpduo.imeprobe'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
