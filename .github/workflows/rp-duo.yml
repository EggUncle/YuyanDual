name: RP Duo build
on:
  push:
    branches: [rp-duo]
  pull_request:
    branches: [rp-duo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify runtime resources
        run: python3 scripts/verify_resources.py
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDualscreenDebug
      - name: Verify packaged dictionaries and microphone permission
        run: |
          python3 scripts/verify_resources.py app/build/outputs/apk/dualscreen/debug/*.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/dualscreen/debug/*.apk > /tmp/apk-permissions.txt
          cat /tmp/apk-permissions.txt
          if grep -q 'android.permission.RECORD_AUDIO' /tmp/apk-permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: yuyan-rp-duo-debug
          path: app/build/outputs/apk/dualscreen/debug/*.apk
          if-no-files-found: error
